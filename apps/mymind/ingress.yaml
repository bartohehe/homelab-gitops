apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mymind-auth
  namespace: mymind
spec:
  basicAuth:
    secret: mymind-auth-users
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mymind
  namespace: mymind
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: mymind-mymind-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - mymind.k8s.home.arpa
      secretName: homelab-wildcard
  rules:
    - host: mymind.k8s.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mymind
                port:
                  number: 3000
