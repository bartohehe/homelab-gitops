apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mymind-tls
  namespace: mymind
spec:
  secretName: mymind-tls
  duration: 2160h
  renewBefore: 360h
  dnsNames:
    - mymind.k8s.home.arpa
  privateKey:
    rotationPolicy: Always
  issuerRef:
    name: homelab-ca
    kind: ClusterIssuer
    group: cert-manager.io
