apiVersion: v1
kind: Service
metadata:
  name: mymind-db
  namespace: mymind
spec:
  clusterIP: None
  selector:
    app: mymind-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mymind-db
  namespace: mymind
spec:
  serviceName: mymind-db
  replicas: 1
  selector:
    matchLabels:
      app: mymind-db
  template:
    metadata:
      labels:
        app: mymind-db
    spec:
      containers:
        - name: postgres
          image: postgres:17-bookworm
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: mymind
            - name: POSTGRES_DB
              value: mymind
            - name: TZ
              value: Europe/Warsaw
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mymind-db
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U mymind -d mymind
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
