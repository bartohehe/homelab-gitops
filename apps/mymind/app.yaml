apiVersion: apps/v1
kind: Deployment
metadata:
  name: mymind
  namespace: mymind
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mymind
  template:
    metadata:
      labels:
        app: mymind
    spec:
      containers:
        - name: mymind
          image: ghcr.io/bartohehe/mymind:main
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: TZ
              value: Europe/Warsaw
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mymind-db
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mymind
  namespace: mymind
spec:
  type: ClusterIP
  selector:
    app: mymind
  ports:
    - port: 3000
      targetPort: 3000
