apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: courseshub
  namespace: courseshub
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - courseshub.k8s.home.arpa
      secretName: courseshub-tls
  rules:
    - host: courseshub.k8s.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: courseshub
                port:
                  number: 8080
