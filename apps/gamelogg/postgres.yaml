apiVersion: v1
kind: Service
metadata:
  name: gamelogg-db
  namespace: gamelogg
spec:
  clusterIP: None
  selector:
    app: gamelogg-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gamelogg-db
  namespace: gamelogg
spec:
  serviceName: gamelogg-db
  replicas: 1
  selector:
    matchLabels:
      app: gamelogg-db
  template:
    metadata:
      labels:
        app: gamelogg-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: gamelogg
            - name: POSTGRES_DB
              value: gamelogg
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gamelogg-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U gamelogg -d gamelogg
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
